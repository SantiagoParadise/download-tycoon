<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Tycoon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark" data-wallpaper="space">
  <div id="desktop">
    <div id="wallpaper"></div>
    <div id="weather-layer"></div>

    <div id="icons"></div>
    <div id="widgets"></div>
    <div id="windows"></div>

    <div id="taskbar">
      <div id="start-btn" title="Пуск">🖥️</div>
      <div id="task-items"></div>
      <div id="hud">
        <div class="hud-item" id="hud-net"><span class="hud-ic">📶</span><span class="hud-val">—</span></div>
        <div class="hud-item" id="hud-cpu"><span class="hud-ic">🧠</span><span class="hud-val">0%</span></div>
        <div class="hud-item" id="hud-ram"><span class="hud-ic">📊</span><span class="hud-val">0%</span></div>
        <div class="hud-item" id="hud-temp"><span class="hud-ic">🌡️</span><span class="hud-val">0°</span></div>
        <div class="hud-item" id="hud-money"><span class="hud-ic">💰</span><span class="hud-val">0 ₮</span></div>
        <div class="hud-item" id="hud-level"><span class="hud-ic">⭐</span><span class="hud-val">1</span>
          <div class="xpbar"><div class="xpfill" id="xpfill"></div></div>
        </div>
        <div class="hud-item" id="hud-clock"><span class="hud-val">--:--</span></div>
      </div>
    </div>

    <div id="toasts"></div>
    <div id="modal-root"></div>

    <div id="voice-indicator" hidden>
      <div class="voice-pulse"></div>
      <span class="voice-text">Слушаю...</span>
    </div>

    <div id="bsod">
      <div class="bsod-emoji">💙</div>
      <h1>:(</h1>
      <p>На вашем устройстве возникла проблема, и его необходимо перезагрузить.</p>
      <div class="bsod-code">DRIVER_IRQL_NOT_LESS_OR_EQUAL</div>
      <div class="bsod-progress"><i></i></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
